ports:
  - /dev/ttyACM1
  - /dev/ttyACM0
baud: 115200
source: standby
rate_hz: 15.0
csv_path: ""
boot_delay_seconds: 45.0
fc_setup:
  enabled: true
  slam_source_set: 3
  idle_source_set: 1
  switch_after_sends: 1
  select_source_set_on_stream: true
  activate_mode: POSHOLD
  ready_min_quality: 60
  require_rangefinder_height: false
  ahrs_ekf_type: 3
  avoid_enable: 7
  avoid_margin_m: 1.5
  ek2_enable: 0
  ek3_enable: 1
  ek3_src_options: 0
  ek3_ogn_hgt_mask: 0
  viso_type: 0
  viso_pos_x_m: 0.0
  viso_pos_y_m: 0.0
  viso_pos_z_m: 0.0
  viso_qual_min: 0
  posxy_source: 6
  velxy_source: 6
  posz_source: 1
  velz_source: 0
  yaw_source: 1
  prx1_type: 2
  # Disable unused MAVLink GPS2 by default. Only enable this with gps_input when
  # intentionally simulating/providing a second GPS.
  gps2_type: 0
  gps_auto_switch: 0
obstacle:
  enabled: true
  lidar_enabled: true
  lidar_port: auto
  lidar_baud: 3000000
  safety_distance_m: 1.5
  publish_rate_hz: 5.0
  sensor_id: 20
  sector_count: 72
  max_distance_m: 40.0
  min_valid_distance_m: 0.8
  filter_samples: 15
qgc:
  enabled: false
  forward_host: 127.0.0.1
  forward_port: 14550
  bind_host: 0.0.0.0
  bind_port: 14555
gps_input:
  enabled: false
  gps_id: 1
  fixed_fix: false
  fixed_lat_deg: 37.7749
  fixed_lon_deg: -122.4194
  fixed_alt_m: 10.0
  origin_lat_deg: 0.0
  origin_lon_deg: 0.0
  origin_alt_m: 0.0
  satellites_visible: 14
  horiz_accuracy_m: 0.5
  vert_accuracy_m: 1.0
  speed_accuracy_m_s: 0.3
  update_rate_hz: 8.0
external_pose:
  # Optional SLAM sidecar input for Cartographer/OpenVINS/ROS pipelines.
  # Send UDP JSON in local NED/FRD frame to use source: external_udp.
  bind_host: 127.0.0.1
  bind_port: 15560
  max_age_s: 0.35
  first_sample_timeout_s: 3.0
gps_denied:
  enabled: true
  require_imu: true
  require_rc_link: true
  require_rangefinder: true
  require_ekf_status: true
  require_attitude: true
  require_local_position: true
  require_origin_for_gps_input: true
  require_calibration_or_observer: true
  stable_seconds: 3.0
  max_pose_dt_s: 0.35
  max_pose_jump_m: 1.25
  max_velocity_m_s: 5.0
  max_rangefinder_disagreement_m: 1.0
  min_observer_score: 7.0
  announce_interval_s: 10.0
  status_write_interval_s: 1.0
  status_path: logs/gps_denied_readiness.json
lidar_steering:
  enabled: false
  trigger_distance_m: 2.0
  clear_distance_m: 2.4
  max_speed_m_s: 0.5
  angle_offset_deg: 0.0
  allowed_modes:
  - GUIDED
calibration:
  enabled: true
  mode: BRAKE
  duration_s: 12.0
  min_samples: 80
  min_gps_fix_type: 3
  min_gps_satellites: 8
  max_horizontal_speed_m_s: 0.35
  max_roll_deg: 7.0
  max_pitch_deg: 7.0
  min_pose_quality: 55
  profile_path: runtime/slam_calibration.json
  auto_rtl_after_complete: true
  fallback_mode: LOITER
  target_height_m: 5.0
  target_height_tolerance_m: 0.35
  ground_max_height_m: 0.7
  height_stage_timeout_s: 120.0
  axis_stage_duration_s: 8.0
  axis_stage_timeout_s: 25.0
  total_timeout_s: 240.0
  max_stationary_drift_m: 0.35
  max_stage_drift_m: 1.0
  require_rc_link: true
  movement_commands_enabled: false
  movement_speed_m_s: 0.12
  vertical_speed_m_s: 0.08
  altitude_hold_gain: 0.25
  altitude_hold_deadband_m: 0.12
  yaw_rate_deg_s: 6.0
  dry_run: false
  kill_switch_confirmed: false
  min_battery_remaining_pct: 20
  status_path: logs/slam_calibration_status.json
  log_path: logs/slam_calibration.log
soft_calibration:
  enabled: true
  mode: LOITER
  duration_s: 20.0
  min_samples: 120
  min_gps_fix_type: 3
  min_gps_satellites: 8
  min_pose_quality: 45
  announce_interval_s: 10.0
  ready_score_threshold: 7.0
  low_score_threshold: 5.0
  critical_score_threshold: 3.0
  save_improvement_threshold: 0.3
  profile_path: runtime/loiter_soft_calibration.json
  sample_log_path: logs/loiter_soft_learning.jsonl
  sample_log_hz: 1.0
  fallback_enabled: false
  fallback_mode: LOITER
slam_observer:
  enable_loiter_observation: true
  observation_message_interval_sec: 20
  min_quality_for_poshold: 7.0
  weak_quality_threshold: 5.0
  critical_quality_threshold: 3.0
  quality_update_delta: 0.5
  enable_live_soft_correction: false
  enable_auto_fallback_to_loiter: false
  log_observation_data: true
  log_path: logs/slam_loiter_observer.log
  status_path: logs/slam_loiter_observer_status.json
