[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optflow-slam"
version = "0.1.0"
description = "GPS-independent optical-flow flight and Jetson SLAM foundation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=11,<12",
    "pymavlink>=2.4.49,<3",
    "pyrealsense2==2.57.7.10387",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
optflow-preflight = "optflow_slam.cli:main"
optflow-rgb = "optflow_slam.camera_server:main"
optflow-visualizer = "optflow_slam.visualizer_server:main"
optflow-flight-log = "optflow_slam.flight_logger:main"
optflow-flight-service = "optflow_slam.flight_service:main"
optflow-flight-supervisor = "optflow_slam.flight_supervisor:main"
optflow-flight-status = "optflow_slam.flight_service:status_main"
optflow-sensor-check = "optflow_slam.sensor_check:main"
optflow-obstacle-check = "optflow_slam.obstacle_check:main"
optflow-obstacle-service = "optflow_slam.obstacle_avoidance_service:main"
optflow-obstacle-status = "optflow_slam.obstacle_avoidance_service:status_main"
optflow-jt16-calibrate = "optflow_slam.jt16_calibration:main"
optflow-jt16-plane = "optflow_slam.jt16_plane_calibration:main"
optflow-analyze-flight = "optflow_slam.flight_analysis:main"
optflow-slam-timing = "optflow_slam.slam_timing:main"
optflow-im10a-config = "optflow_slam.im10a_config:main"
optflow-imu-noise = "optflow_slam.imu_noise_calibration:main"
optflow-imu-align = "optflow_slam.imu_alignment:main"
optflow-lio-bridge = "optflow_slam.lio_bridge:main"
optflow-lio-shadow = "optflow_slam.lio_shadow:main"
optflow-lio-validate = "optflow_slam.lio_validation:main"
optflow-slam-poc = "optflow_slam.slam_poc:main"
optflow-rtl-shadow = "optflow_slam.rtl_shadow:main"
optflow-slam-return = "optflow_slam.slam_navigation_service:main"
optflow-slam-return-setup = "optflow_slam.slam_return_setup:main"
optflow-slam-return-status = "optflow_slam.slam_navigation_service:status_main"
optflow-prearm-status = "optflow_slam.slam_navigation_service:prearm_status_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
