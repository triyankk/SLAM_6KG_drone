[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optflow-slam"
version = "0.1.0"
description = "GPS-independent optical-flow flight and Jetson SLAM foundation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=11,<12",
    "pymavlink>=2.4.49,<3",
    "pyrealsense2==2.57.7.10387",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
optflow-preflight = "optflow_slam.cli:main"
optflow-rgb = "optflow_slam.camera_server:main"
optflow-visualizer = "optflow_slam.visualizer_server:main"
optflow-flight-log = "optflow_slam.flight_logger:main"
optflow-analyze-flight = "optflow_slam.flight_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
