# NVIDIA X configuration for a persistent 1920x1080 desktop on Jetson.
# DFP-1 is the NVIDIA name for the working DP-1 connector on this aircraft.

Section "Module"
    Disable "dri"
    SubSection "extmod"
        Option "omit xfree86-dga"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection

Section "Device"
    Identifier "Tegra0"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ConnectedMonitor" "DFP-1"
    Option "CustomEDID" "DFP-1:/lib/firmware/edid/optflow-headless-1080p.bin"
    Option "UseDisplayDevice" "DFP-1"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 28-80
    VertRefresh 48-75
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Tegra0"
    Monitor "Monitor0"
    DefaultDepth 24
    Option "MetaModes" "DFP-1: 1920x1080 +0+0"
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection
